---
layout: default
---
{%- assign c = site.data.categories | where: "slug", page.slug_cat | first -%}
{%- assign posts = site.posts | where: "section", c.slug -%}
<header class="page-header">
  <h1 class="page-title">{{ c.name }}</h1>
  <div class="taxonomy-description"><p>{{ c.description }}</p></div>
</header>
{% for post in posts %}{% include excerpt.html post=post %}{% endfor %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
{"@type":"ListItem","position":1,"name":"Home","item":"{{ '/' | absolute_url }}"},
{"@type":"ListItem","position":2,"name":{{ c.name | jsonify }}}]}
</script>
