<header class="site-header">
  <div class="inside-header container">
    <p class="main-title"><a href="{{ '/' | relative_url }}" rel="home">{{ site.title }}</a></p>
    <nav class="main-navigation" aria-label="Primary"><ul>
      {%- for l in site.data.menu %}
      <li><a href="{{ l.url | relative_url }}"{% if page.url == l.url %} aria-current="page"{% endif %}>{{ l.title }}</a></li>
      {%- endfor %}
    </ul></nav>
  </div>
</header>
